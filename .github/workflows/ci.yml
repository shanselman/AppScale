name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build native + managed, unit tests
        shell: pwsh
        run: scripts/build.ps1
      # Hosted runners are elevated and 1024x768, so the end-to-end tests self-skip there with a stated reason.
      # They are required to pass on a non-elevated desktop: scripts/build.ps1 -Integration
      - name: Integration tests (skip on elevated / small-display runners)
        shell: pwsh
        run: |
          $env:APPSCALE_REQUIRE_HARNESSES = '1'
          dotnet test tests/AppScale.IntegrationTests -c Release --no-build -nologo --logger "trx;LogFileName=integration.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'
