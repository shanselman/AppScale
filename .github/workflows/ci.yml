name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build native + managed, unit tests
        shell: pwsh
        run: scripts/build.ps1
      - name: Integration tests (owned harnesses, interactive desktop session)
        shell: pwsh
        run: |
          $env:APPSCALE_REQUIRE_HARNESSES = '1'
          dotnet test tests/AppScale.IntegrationTests -c Release --no-build -nologo --logger "trx;LogFileName=integration.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'
